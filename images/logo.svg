<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Karate Strassen Luxembourg Logo">
  <title>KSL - Karate Strassen Luxembourg</title>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#000000" stroke="#CC0000" stroke-width="3"/>

  <!-- Stylized karate fist -->
  <!-- Palm base -->
  <rect x="38" y="62" width="44" height="24" rx="5" ry="5" fill="#CC0000"/>

  <!-- Fingers curled (top of fist) -->
  <!-- Index finger knuckle -->
  <rect x="38" y="46" width="10" height="20" rx="4" ry="4" fill="#CC0000"/>
  <!-- Middle finger knuckle -->
  <rect x="50" y="42" width="10" height="24" rx="4" ry="4" fill="#CC0000"/>
  <!-- Ring finger knuckle -->
  <rect x="62" y="44" width="10" height="22" rx="4" ry="4" fill="#CC0000"/>
  <!-- Pinky knuckle -->
  <rect x="74" y="48" width="8" height="18" rx="4" ry="4" fill="#CC0000"/>

  <!-- Thumb -->
  <rect x="30" y="62" width="12" height="10" rx="4" ry="4" fill="#CC0000" transform="rotate(-15 36 67)"/>

  <!-- Knuckle highlights -->
  <ellipse cx="43" cy="48" rx="4" ry="3" fill="#ffffff" opacity="0.25"/>
  <ellipse cx="55" cy="44" rx="4" ry="3" fill="#ffffff" opacity="0.25"/>
  <ellipse cx="67" cy="46" rx="4" ry="3" fill="#ffffff" opacity="0.25"/>
  <ellipse cx="78" cy="50" rx="3" ry="2.5" fill="#ffffff" opacity="0.25"/>

  <!-- Red belt stripe at bottom -->
  <rect x="2" y="100" width="116" height="8" rx="0" fill="#CC0000" opacity="0.85"/>

  <!-- KSL text -->
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">KSL</text>
</svg>
