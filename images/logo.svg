<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Karate Strassen Luxembourg Logo">
  <title>KSL - Karate Strassen Luxembourg</title>
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="56" fill="#1a1a1a" stroke="#CC0000" stroke-width="3"/>
  <!-- Inner decorative ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#CC0000" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Stylized karate fist -->
  <!-- Palm base -->
  <rect x="44" y="62" width="32" height="22" rx="4" ry="4" fill="#CC0000"/>
  <!-- Thumb -->
  <rect x="36" y="66" width="11" height="9" rx="3" ry="3" fill="#CC0000"/>
  <!-- Finger 1 (index) -->
  <rect x="44" y="46" width="7" height="20" rx="3" ry="3" fill="#CC0000"/>
  <!-- Finger 2 (middle) -->
  <rect x="53" y="42" width="7" height="24" rx="3" ry="3" fill="#CC0000"/>
  <!-- Finger 3 (ring) -->
  <rect x="62" y="45" width="7" height="21" rx="3" ry="3" fill="#CC0000"/>
  <!-- Finger 4 (pinky) -->
  <rect x="71" y="50" width="6" height="16" rx="3" ry="3" fill="#CC0000"/>

  <!-- Knuckle highlight lines -->
  <line x1="46" y1="62" x2="74" y2="62" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>

  <!-- Motion lines suggesting a strike -->
  <line x1="20" y1="50" x2="38" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="15" y1="58" x2="36" y2="58" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <line x1="20" y1="66" x2="36" y2="66" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.25"/>

  <!-- KSL text at bottom -->
  <text x="60" y="103" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">KSL</text>
</svg>
